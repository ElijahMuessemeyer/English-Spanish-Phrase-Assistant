[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phrase-assistant"
version = "1.0.0"
description = "English to Spanish Travel Phrase Assistant - A retrieval-based CLI chatbot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "spacy>=3.0",
    "nltk>=3.8",
    "textblob>=0.17",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
phrasebot = "phrasebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
